[project]
name = "rulestorm"
version = "0.1.0"
description = "AI-powered policy simulation and stress testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.7",
    "boto3[crt]>=1.40",  # crt: needed for `aws login` profiles (login_session)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
rulestorm = "rulestorm.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rulestorm*"]

[tool.setuptools.package-data]
rulestorm = ["templates/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
